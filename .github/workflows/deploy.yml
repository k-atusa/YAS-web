name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/arm64
          tags: d3vle0/yas-web-backend:latest
          cache-from: type=registry,ref=d3vle0/yas-web-backend:buildcache
          cache-to: type=registry,ref=d3vle0/yas-web-backend:buildcache,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/arm64
          tags: d3vle0/yas-web-frontend:latest
          cache-from: type=registry,ref=d3vle0/yas-web-frontend:buildcache
          cache-to: type=registry,ref=d3vle0/yas-web-frontend:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: "docker-compose.yml"
          target: ${{ secrets.SERVER_TARGET_DIR || '~/YAS-web' }}

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            # 서버 내 프로젝트 경로 (예: /home/ubuntu/YAS-web)로 이동 후 배포하는 스크립트입니다.
            # 이 경로는 서버 환경에 맞게 수정이 필요할 수 있습니다.
            cd ${{ secrets.SERVER_TARGET_DIR || '~/YAS-web' }}
            docker compose pull
            docker compose up -d
