name: Release

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: backend/go.sum

      - name: Build Frontend and embed into Backend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Extract version from tag
        id: vars
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Cross-Platform Binaries
        working-directory: backend
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          mkdir -p ../dist-release

          # Windows amd64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" \
            -o "../dist-release/yas-web-${VERSION}-windows-amd64.exe" ./cmd/server

          # Windows arm64
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" \
            -o "../dist-release/yas-web-${VERSION}-windows-arm64.exe" ./cmd/server

          # Linux amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" \
            -o "../dist-release/yas-web-${VERSION}-linux-amd64" ./cmd/server

          # Linux arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" \
            -o "../dist-release/yas-web-${VERSION}-linux-arm64" ./cmd/server

          # macOS arm64
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" \
            -o "../dist-release/yas-web-${VERSION}-darwin-arm64" ./cmd/server

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: |
            dist-release/yas-web-${{ steps.vars.outputs.version }}-windows-amd64.exe
            dist-release/yas-web-${{ steps.vars.outputs.version }}-windows-arm64.exe
            dist-release/yas-web-${{ steps.vars.outputs.version }}-linux-amd64
            dist-release/yas-web-${{ steps.vars.outputs.version }}-linux-arm64
            dist-release/yas-web-${{ steps.vars.outputs.version }}-darwin-arm64

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Docker image metadata
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if [ -z "$DOCKERHUB_USERNAME" ]; then
              echo "Error: DOCKERHUB_USERNAME secret is not set." >&2
              exit 1
            fi
            echo "is_release_tag=true" >> "$GITHUB_OUTPUT"
            IMAGE_NAME="${DOCKERHUB_USERNAME}/yas-web"
            echo "tags=${IMAGE_NAME}:${TAG_NAME},${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "is_release_tag=false" >> "$GITHUB_OUTPUT"
            echo "tags=yas-web:${TAG_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.meta.outputs.is_release_tag == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Alpine Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.is_release_tag == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
