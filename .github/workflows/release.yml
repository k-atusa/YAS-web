name: Release Binaries

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: backend/go.sum

      - name: Build Frontend and embed into Backend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Extract version from tag
        id: vars
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Cross-Platform Binaries
        working-directory: backend
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          mkdir -p ../dist-release

          # Windows amd64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" \
            -o "../dist-release/yas-web-${VERSION}-windows-amd64.exe" ./cmd/server

          # Windows arm64
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" \
            -o "../dist-release/yas-web-${VERSION}-windows-arm64.exe" ./cmd/server

          # Linux amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" \
            -o "../dist-release/yas-web-${VERSION}-linux-amd64" ./cmd/server

          # Linux arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" \
            -o "../dist-release/yas-web-${VERSION}-linux-arm64" ./cmd/server

          # macOS arm64
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" \
            -o "../dist-release/yas-web-${VERSION}-darwin-arm64" ./cmd/server

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: |
            dist-release/yas-web-${{ steps.vars.outputs.version }}-windows-amd64.exe
            dist-release/yas-web-${{ steps.vars.outputs.version }}-windows-arm64.exe
            dist-release/yas-web-${{ steps.vars.outputs.version }}-linux-amd64
            dist-release/yas-web-${{ steps.vars.outputs.version }}-linux-arm64
            dist-release/yas-web-${{ steps.vars.outputs.version }}-darwin-arm64
