services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: d3vle0/yas-web-backend:latest
    env_file:
      - ./backend/.env
    environment:
      DB_PATH: /app/data/yas-web.db
      PORT: 7001
      CORS_ORIGIN: '*'
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    ports:
      - "7001:7001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: d3vle0/yas-web-frontend:latest
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "4000:80"

volumes:
  backend-data:
