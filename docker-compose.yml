services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  app:
    image: d3vle0/yas-web
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/yas-web
      CORS_ORIGIN: http://localhost:7000
      FRONTEND_DIST: /app/public
      PORT: 7000
    depends_on:
      - mongo
    ports:
      - "7000:7000"
    restart: unless-stopped

volumes:
  mongo-data:
